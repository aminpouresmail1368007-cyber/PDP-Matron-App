name: Build PDP Matron APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: |
          rm -rf pdp-build
          mkdir pdp-build
          unzip -q PDP_Matron_Android_Source_v3_RepoReady.zip -d pdp-build

      - name: Build APK
        working-directory: pdp-build
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDP-Matron-v3-APK
          path: pdp-build/app/build/outputs/apk/debug/app-debug.apk
